<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f18"/>
      <stop offset="0.5" stop-color="#241322"/>
      <stop offset="1" stop-color="#301a29"/>
    </linearGradient>
    <radialGradient id="glowRose" cx="0.82" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#b76e79" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#b76e79" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b76e79" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.14" cy="0.82" r="0.58">
      <stop offset="0" stop-color="#ff8fab" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ff8fab" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff8fab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glowRose)"/>
  <rect width="1600" height="1000" fill="url(#glowPink)"/>
  <rect width="1600" height="1000" fill="url(#glowPurple)"/>

  <g opacity="0.16" stroke="#ff8fab" fill="none" stroke-width="1.2">
    <circle cx="1310" cy="140" r="230"/>
    <circle cx="1310" cy="140" r="340"/>
    <circle cx="1310" cy="140" r="450"/>
  </g>
  <g opacity="0.10" stroke="#ffd43b" fill="none" stroke-width="1">
    <circle cx="190" cy="820" r="170"/>
    <circle cx="190" cy="820" r="270"/>
  </g>

  <g fill="#ff8fab">
    <circle cx="150" cy="210" r="2.4" opacity="0.5"/>
    <circle cx="1180" cy="430" r="1.8" opacity="0.4"/>
    <circle cx="1520" cy="640" r="2.6" opacity="0.4"/>
    <circle cx="640" cy="120" r="1.6" opacity="0.45"/>
    <circle cx="920" cy="860" r="2.0" opacity="0.4"/>
    <circle cx="410" cy="540" r="1.5" opacity="0.5"/>
    <circle cx="760" cy="330" r="2.2" opacity="0.32"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
